<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLab React parity fixture</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.3",
          "react-dom/client": "https://esm.sh/react-dom@19.2.3/client",
          "react/jsx-runtime": "https://esm.sh/react@19.2.3/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@19.2.3/jsx-dev-runtime"
        }
      }
    </script>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module">
      import { createRoot } from "react-dom/client";
      import { jsx } from "react/jsx-runtime";
      import { BLabParityFixture } from "../dist/index.js";

      const theme = new URLSearchParams(window.location.search).get("theme") === "light" ? "light" : "dark";
      document.body.dataset.blabTheme = theme;
      document.body.style.background = "var(--blab-surface-scaffold)";
      document.body.style.color = "var(--blab-text-primary)";
      document.body.style.fontFamily = "var(--blab-font-body)";
      createRoot(document.getElementById("root")).render(
        jsx(BLabParityFixture, { theme }),
      );
    </script>
  </body>
</html>
