schema: "blab.visual-baselines/v1"

metadata:
  version: "0.3.0"
  status: "design-approved-local-baselines"
  visual_intent_owner: "byungskerlab-design-team"
  capture_owner: "engineering-design-system-frontend"
  reproducibility_reviewer: "engineering-quality-reviewer"
  approved_by: "byungsker"
  approved_on: "2026-07-25"
  decision_ref: "BLDS-ALL-PHASES-2026-07-25"
  approval_scope: "capture-workflow-only-not-baseline-images"
  baseline_design_approval: "design-approved-local"
  baseline_reviewed_on: "2026-07-28"
  baseline_reviewer_role: "byungskerlab-design-team"
  baseline_review_evidence_ref: "design-final-gate-handoff:button_contrast_standard_goldens:2026-07-28"
  baseline_approval_scope: "local-reproducibility-and-fixture-review-only"
  baseline_approval_artifact: "contracts/approvals/phase4-local-baselines.design-approval.yaml"

claim_boundary:
  establishes:
    - "deterministic local candidate-image reproducibility"
    - "fixture presence and in-frame geometry for all nine public component families"
    - "Design-approved local baseline identity for reproducibility and fixture review only"
  excludes:
    - "Design-approved visual conformance"
    - "accessibility conformance"
    - "runtime Pretendard or production font-policy evidence"
    - "locale translation approval"
    - "platform, device, consumer, release, or publication conformance"

policy:
  golden_update_requires_design_decision_ref: true
  automatic_golden_acceptance_forbidden: true
  figma_is_downstream_mirror: true
  golden_equality_is_not_accessibility_evidence: true
  deterministic_environment_required: true

required_component_families:
  - "button"
  - "text-field"
  - "segmented-control"
  - "tab-bar"
  - "bottom-bar"
  - "pressable-wrapper"
  - "card"
  - "snackbar"
  - "keyboard-accessory-bar"

known_residuals: []

capture_matrix:
  brightness:
    - "light"
    - "dark"
    - "high-contrast-light"
    - "high-contrast-dark"
  text_scalers:
    - "1.0"
    - "2.0"
  locales:
    - "en-US"
    - "ko-KR"
    - "synthetic-40-percent-expansion"
    - "ar-RTL-bidi"
  locale_fixtures:
    - id: "en-US"
      locale: "en-US"
      text: "real Latin fixture copy"
    - id: "ko-KR"
      locale: "ko-KR"
      text: "real Korean fixture copy"
    - id: "synthetic-40-percent-expansion"
      locale: "en-XA"
      text: "deterministic rune-count expansion of exactly 40 percent within rounding tolerance"
    - id: "ar-RTL-bidi"
      locale: "ar"
      text: "real Arabic RTL copy with Latin BLDS/email and Arabic-Indic numerals"
  reduced_motion:
    - false
    - true
  narrow_viewport: "360x1400"
  expansion_claim: "rune-count-only synthetic stress; no 40 percent rendered-width claim"

capture_environment:
  framework: "Flutter 3.38.5"
  dart: "3.10.4"
  renderer: "flutter-test"
  host: "macos-arm64"
  device_pixel_ratio: 1
  network_during_capture: "forbidden"
  clock: "not-used"
  font_policy: "Pinned fonts are test-only fixtures. Noto files are registered under a process-local Pretendard alias solely because current widgets explicitly request that family; they are not Pretendard and are not runtime assets."
  test_suites:
    - "test/phase4_candidate_golden_test.dart"
    - "test/phase4_candidate_rtl_golden_test.dart"
  shared_harness: "test/support/phase4_candidate_harness.dart"
  overlay_context: "MaterialApp.builder wraps Navigator and Overlay with the scenario MediaQuery and Directionality; MaterialApp owns the declared root locale."
  update_commands:
    - "flutter test test/phase4_candidate_golden_test.dart --update-goldens --concurrency=1"
    - "flutter test test/phase4_candidate_rtl_golden_test.dart --update-goldens --concurrency=1"
  check_commands:
    - "flutter test test/phase4_candidate_golden_test.dart --concurrency=1"
    - "flutter test test/phase4_candidate_rtl_golden_test.dart --concurrency=1"

