schema: "blab.agent-component-registry/v1"

metadata:
  version: "0.1.0"
  status: "local-contract"
  semantic_source: "contracts/blab.design.yaml"
  state_source: "contracts/components/state-applicability.yaml"
  generated_state_evidence: "generated/component-state-coverage.yaml"
  token_source: "contracts/tokens/blab.tokens.yaml"
  ownership:
    semantic: "byungskerlab-design-team"
    implementation: "engineering-design-system-frontend"
    registry_maintenance: "engineering-design-system-frontend"
  authority:
    source_of_truth: "contracts/blab.design.yaml"
    registry_role: "agent-consumption-index-only"
    remote_mutation: false

components:
  - id: "button"
    public_type: "BLabButton"
    purpose: "Primary, secondary, and destructive action control."
    usage_boundary: "Use for an explicit user action; do not use as a selected or loading control until those states are claimed."
    source: "lib/src/widgets/liquid_glass_button.dart"
    example: "example/lib/stories/button_story.dart"
    test: "test/blab_button_test.dart"
    documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
    token_references:
      - "component.button.primary.background"
      - "component.button.primary.foreground"
      - "component.button.focus-outer-ring"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "44x44 minimum interactive target"
    state_contract_id: "button"

  - id: "text-field"
    public_type: "BLabTextField"
    purpose: "Single-line and multiline text input with helper, error, read-only, and clear-action semantics."
    usage_boundary: "Use for user text entry; validation and loading behavior remain conditional or unclaimed where the state contract says so."
    source: "lib/src/widgets/liquid_glass_text_field.dart"
    example: "example/lib/stories/text_field_story.dart"
    test: "test/blab_text_field_test.dart"
    documentation: "docs/BLDS_PHASE_3_TEXT_FIELD_STATUS.md"
    token_references:
      - "component.text-field.label"
      - "component.text-field.hint"
      - "component.text-field.focus-outline"
      - "component.text-field.error-border"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "Text scaling must remain ambient"
    state_contract_id: "text-field"

  - id: "segmented-control"
    public_type: "BLabSegmentedControl"
    purpose: "Controlled selection among a small set of mutually exclusive options."
    usage_boundary: "Use for controlled selection; use owned horizontal overflow only under the documented conditional contract."
    source: "lib/src/widgets/blab_segmented_control.dart"
    example: "example/lib/stories/segmented_story.dart"
    test: "test/blab_segmented_control_test.dart"
    documentation: "docs/BLDS_PHASE_3_SEGMENTED_CONTROL_STATUS.md"
    token_references:
      - "component.segmented.container-surface"
      - "component.segmented.selected-surface"
      - "component.segmented.selected-foreground"
      - "component.segmented.focus-outline"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "Controlled selection and roving keyboard focus"
    state_contract_id: "segmented-control"

  - id: "tab-bar"
    public_type: "BLabTabBar"
    purpose: "Controlled in-screen navigation across a small set of tabs."
    usage_boundary: "Use for in-screen tab switching; do not substitute for bottom navigation or uncontrolled selection."
    source: "lib/src/widgets/liquid_glass_tab_bar.dart"
    example: "example/lib/stories/tab_bar_story.dart"
    test: "test/blab_tab_bar_test.dart"
    documentation: "docs/BLDS_PHASE_3_TAB_BAR_STATUS.md"
    token_references:
      - "component.tab.container-surface"
      - "component.tab.selected-indicator"
      - "component.tab.selected-foreground"
      - "component.tab.focus-outline"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "Controlled selection"
    state_contract_id: "tab-bar"

  - id: "bottom-bar"
    public_type: "BLabBottomBar"
    purpose: "Bottom navigation with selected, focus, drag, optional action, and localized label behavior."
    usage_boundary: "Use for top-level product navigation; accessibility-large reflow and action semantics remain bounded by the consumer and state contract."
    source: "lib/src/widgets/liquid_glass_bottom_bar.dart"
    example: "example/lib/stories/bottom_bar_story.dart"
    test: "test/blab_bottom_bar_test.dart"
    documentation: "docs/BLDS_PHASE_3_BOTTOM_BAR_STATUS.md"
    token_references:
      - "component.bottom-bar.container-surface"
      - "component.bottom-bar.selected-surface"
      - "component.bottom-bar.selected-foreground"
      - "component.bottom-bar.action-surface"
      - "component.bottom-bar.focus-outline"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "44x44 minimum interactive target"
      - "Accessibility-large reflow must not shrink text to hide overflow"
    state_contract_id: "bottom-bar"

  - id: "pressable-wrapper"
    public_type: "BLabPressableWrapper"
    purpose: "Interaction primitive for press, hover, focus, and action-derived semantics."
    usage_boundary: "Use only when the wrapped content has a real action; static content must not receive interactive semantics."
    source: "lib/src/widgets/pressable_wrapper.dart"
    example: "example/lib/stories/pressable_story.dart"
    test: "test/blab_pressable_card_test.dart"
    documentation: "docs/BLDS_PHASE_3_PRESSABLE_CARD_STATUS.md"
    token_references:
      - "component.pressable.hover-overlay"
      - "component.pressable.pressed-overlay"
      - "component.pressable.focus-outline"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "Haptic policy is default-deny"
    state_contract_id: "pressable-wrapper"

  - id: "card"
    public_type: "BLabCard"
    purpose: "Glass surface container that may become actionable when an explicit action is supplied."
    usage_boundary: "Use as a visual grouping surface; derive interactive semantics only from an actual action callback."
    source: "lib/src/widgets/liquid_glass_card.dart"
    example: "example/lib/stories/card_story.dart"
    test: "test/blab_pressable_card_test.dart"
    documentation: "docs/BLDS_PHASE_3_PRESSABLE_CARD_STATUS.md"
    token_references:
      - "component.card.surface"
      - "component.card.border"
      - "component.pressable.focus-outline"
      - "semantic.surface.glass"
    platform_constraints:
      - "Flutter package API"
      - "Static cards must remain non-interactive"
    state_contract_id: "card"

  - id: "snackbar"
    public_type: "BLabSnackbar"
    purpose: "Transient feedback surface for success, error, warning, and info messages."
    usage_boundary: "Use for short-lived feedback with readable timing and optional action; do not use as persistent content or modal error handling."
    source: "lib/src/widgets/blab_snackbar.dart"
    example: "example/lib/stories/snackbar_story.dart"
    test: "test/blab_snackbar_test.dart"
    documentation: "docs/BLDS_PHASE_3_SNACKBAR_STATUS.md"
    token_references:
      - "component.snackbar.surface"
      - "component.snackbar.foreground"
      - "component.snackbar.border"
      - "semantic.status.success"
      - "semantic.status.error"
    platform_constraints:
      - "Flutter package API"
      - "Do not steal focus from the current task"
    state_contract_id: "snackbar"

  - id: "keyboard-accessory-bar"
    public_type: "BLabKeyboardAccessoryBar"
    purpose: "Keyboard accessory actions for navigation, editing, and completion."
    usage_boundary: "Use alongside an active text-input flow; action availability and overflow remain explicit per item."
    source: "lib/src/widgets/keyboard_accessory_bar.dart"
    example: "example/lib/stories/keyboard_accessory_story.dart"
    test: "test/blab_keyboard_accessory_bar_test.dart"
    documentation: "docs/BLDS_PHASE_3_KEYBOARD_ACCESSORY_STATUS.md"
    token_references:
      - "component.keyboard-accessory.surface-start"
      - "component.keyboard-accessory.border"
      - "component.keyboard-accessory.foreground"
      - "component.keyboard-accessory.focus-outline"
      - "semantic.focus.ring"
    platform_constraints:
      - "Flutter package API"
      - "Horizontal overflow is owned and scrollable when conditional"
    state_contract_id: "keyboard-accessory-bar"
