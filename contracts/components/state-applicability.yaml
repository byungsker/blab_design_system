schema: "blab.component-states/v1"

metadata:
  version: "0.1.0"
  status: "approved"
  owner: "byungskerlab-design-team"
  implementation_evidence_owner: "engineering-design-system-frontend"
  implementation_evidence_as_of: "2026-07-26"
  approved_by: "byungsker"
  approved_on: "2026-07-25"
  decision_ref: "BLDS-ALL-PHASES-2026-07-25"

rules:
  applicable_states_require_behavior_semantics_and_evidence: true
  conditional_states_require_additive_api_callback_runtime_or_content_condition: true
  not_applicable_states_must_not_be_simulated: true
  standard_mode_values_remain_compatibility_locked: true
  approved_standard_mode_compatibility_exceptions:
    - decision_ref: "BLDS-BUTTON-CONTRAST-2026-07-28"
      decision_document: "docs/BLDS_PHASE_3_BUTTON_CONTRAST_DECISION.md"
      component_id: "button"
      modes: ["light", "dark"]
      token_ids:
        - "semantic.action.primary-foreground"
        - "semantic.action.destructive-foreground"
      replacement: "primitive.color.black"

components:
  - id: "button"
    public_type: "BLabButton"
    required: ["default", "hover-pointer", "pressed", "focus", "disabled", "destructive-variant"]
    conditional: ["loading-busy"]
    not_applicable: ["selected", "current", "invalid", "expanded"]
    implementation_evidence:
      default:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      destructive-variant:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      disabled:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      focus:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      hover-pointer:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      pressed:
        status: "implemented-local"
        test: "test/blab_button_test.dart"
        documentation: "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
    absence_evidence:
      loading-busy:
        status: "typed-code-inspection-only"
        evidence:
          - "lib/src/widgets/liquid_glass_button.dart"
          - "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      invalid:
        status: "observable-runtime-validation-absence"
        evidence:
          - "test/blab_button_test.dart"
          - "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      selected:
        status: "observable-runtime-semantics-absence"
        evidence:
          - "test/blab_button_test.dart"
          - "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      expanded:
        status: "observable-runtime-semantics-absence"
        evidence:
          - "test/blab_button_test.dart"
          - "docs/BLDS_PHASE_3_BUTTON_STATUS.md"
      current:
        status: "typed-code-inspection-only"
        evidence:
