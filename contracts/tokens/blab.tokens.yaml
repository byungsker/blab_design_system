legacy_mappings:
  policy:
    standard_light_and_dark_are_compatibility_locked: true
    unmapped_values_must_be_classified: true
    deprecation_values: ["none", "legacy-retained", "deprecated"]
    classification_values:
      - "mapped"
      - "legacy-compatible"
      - "legacy-retained"
      - "component-local-raw"
