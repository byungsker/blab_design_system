schema: "blab.design/v1"

metadata:
  contract_version: "0.2.0"
  status: "approved"
  authoritative: true
  title: "Blab Design Contract"
  semantic_owner: "byungskerlab-design-team"
  implementation_owner: "engineering-design-system-frontend"
  effective_on: "2026-07-25"
  approval:
    approved_by: "byungsker"
    approved_on: "2026-07-25"
    decision_ref: "BLDS-ALL-PHASES-2026-07-25"
    scope:
      - "repository-owned-machine-readable-ssot"
      - "phase0-accessibility-and-localization-policy"
      - "mit-license-selection"
      - "analyzer-backed-public-api-baseline"
      - "phase1-through-phase5-local-implementation"
      - "additive-high-contrast-and-interaction-foundation"

authority:
  visual_and_semantic_authority: "Blab"
  blab_semantics_owner: "byungskerlab-design-team"
  engineering_ownership: "implementation-generation-tests-compatibility-and-rollback"
  authority_order:
    - "contracts/blab.design.yaml"
    - "generated-or-manually-preserved-platform-outputs"
    - "flutter-components-examples-tests-and-diagnostics"
    - "figma-and-agent-skill-distribution-mirrors"
  astryx_role: "capability-evidence-only"
  astryx_exclusions:
    - "visual-values"
    - "vocabulary"
    - "component-appearance"
    - "page-composition"
    - "product-copy"
    - "cross-platform-policy"
  release_publication_and_external_mutation_require_separate_authority: true

shared_system_policy:
  name: "rule-of-two"
  minimum_real_product_needs: 2
  applies_to:
    - "shared-primitives"
    - "shared-components"
    - "shared-capabilities"
    - "cross-framework-packages"
  exception_authority: "byungsker"
  exception_must_be_explicit_and_documented: true
  approved_exceptions:
    - id: "BLDS-ALL-PHASES-2026-07-25"
      approved_by: "byungsker"
      approved_on: "2026-07-25"
      rationale: "Complete the approved BLDS Astryx capability-adoption plan while preserving Blab visual authority."
      scope:
        - "flutter-theme-extensions"
        - "shared-accessibility-interaction-foundation"
        - "component-state-contracts"
        - "diagnostics-documentation-and-migration-tooling"
      excluded:
        - "shared-web-package"
        - "new-product-domain-components"
        - "publication-or-release"
        - "public-conformance-claim"

values:
  strategy: "typed-deterministic-phase1a"
  policy: "The typed model is the deterministic Phase 1A generation input. The reference manifest retains immutable Phase 0 historical digests; a migrated source adds separate current implementation evidence and validation targets only the current digest. Unmigrated standard light and dark sources remain hand-maintained and byte-preserved."
  typed_token_model_ref: "contracts/tokens/blab.tokens.yaml"
  reference_manifest_policy:
    phase0_historical_digests_immutable: true
    migrated_sources_require_separate_current_evidence: true
    validation_target: "current-digest-when-present-otherwise-historical"
  token_layers:
    primitive:
      status: "reference-preserved-taxonomy-not-yet-normalized"
      current_value_refs:
        - "docs/design/tokens.css"
        - "lib/src/theme/app_colors.dart"
        - "lib/src/theme/app_typography.dart"
        - "lib/src/theme/app_spacing.dart"
        - "lib/src/theme/app_radius.dart"
        - "lib/src/theme/app_shadow.dart"
        - "lib/src/theme/app_motion.dart"
        - "lib/src/theme/app_glass.dart"
    semantic:
      status: "reference-preserved-taxonomy-not-yet-normalized"
      current_value_refs:
        - "docs/design/tokens.css"
        - "lib/src/theme/app_colors.dart"
        - "lib/src/theme/app_theme.dart"
    component:
      status: "reference-preserved-taxonomy-incomplete"
      current_value_refs:
        - "lib/src/widgets/blab_segmented_control.dart"
        - "lib/src/widgets/blab_snackbar.dart"
