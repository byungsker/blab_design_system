accessibility:
  policy_status: "approved"
  policy_version: "0.2.0"
  supported_visual_modes:
    - "light"
    - "dark"
    - "high-contrast-light"
    - "high-contrast-dark"
  standard_mode_compatibility:
    preserve_existing_values_exactly: true
    existing_nonconforming_pairs_are_legacy_evidence: true
    silent_visual_normalization_forbidden: true
  high_contrast:
    activation:
      - "platform-preference"
      - "explicit-product-adapter"
    light:
      surface: "#FFFFFF"
      foreground: "#000000"
      border: "#000000"
      focus: "#000000"
    dark:
      surface: "#121212"
      foreground: "#FFFFFF"
      border: "#FFFFFF"
      focus: "#FFFFFF"
    semantic_role_resolution:
      surface_roles:
        light:
          base: "#FFFFFF"
          raised: "#FFFFFF"
          overlay: "#FFFFFF"
          glass: "#FFFFFF"
        dark:
          base: "#121212"
          raised: "#121212"
          overlay: "#121212"
          glass: "#121212"
      text_roles:
        light:
          primary: "#000000"
          secondary: "#000000"
          tertiary: "#000000"
          inverse: "#FFFFFF"
        dark:
          primary: "#FFFFFF"
          secondary: "#FFFFFF"
          tertiary: "#FFFFFF"
          inverse: "#000000"
      border_roles:
        light:
          subtle: "#000000"
          default: "#000000"
          strong: "#000000"
        dark:
          subtle: "#FFFFFF"
          default: "#FFFFFF"
          strong: "#FFFFFF"
      action_and_status_backgrounds:
        primary: "primitive.color.primary"
        destructive: "primitive.color.error"
        success: "primitive.color.success"
        error: "primitive.color.error"
        warning: "primitive.color.warning"
        info: "primitive.color.info"
      focus_by_surface:
        light: "#000000"
        dark: "#FFFFFF"
        accent: "#000000"
    action_foregrounds:
      primary: "#000000"
      destructive: "#000000"
      status: "#000000"
    disabled_foregrounds:
      light: "#6B7280"
      dark: "#9CA3AF"
    glass:
      blur: 0
      saturation_percent: 100
      highlight: "none"
      shadow: "none"
      surface_opacity: 1
    color_alone_for_state_forbidden: true
    unlisted_failed_pairing_requires_design_decision: true
  contrast:
    normal_text_minimum_ratio: 4.5
    large_text_minimum_ratio: 3.0
    key_reading_surface_preferred_ratio: 7.0
  pointer_target:
    minimum_width: 44
    minimum_height: 44
    unit: "logical-or-css-pixels-as-platform-appropriate"
    exceptions_require_documented_design_review: true
  focus:
    visible_required: true
    modality_aware: true
    minimum_outline_width: 2
    distinct_focus_ring_width: 3
    generated_geometry_tokens:
      outline: "semantic.focus.outline-width"
      distinct_ring: "semantic.focus.ring-width"
    surface_color_tokens:
      canvas: "semantic.focus.canvas"
      surface: "semantic.focus.surface"
      accent: "semantic.focus.accent"
    adjacent_contrast_minimum_ratio: 3.0
    logical_reading_order_required: true
    enter_and_space_activation_for_button_like_controls_required: true
    arrow_navigation_for_tabs_and_segments_required: true
    escape_or_platform_back_dismissal_where_applicable: true
    modal_or_focus_owning_overlay_containment_and_return_required: true
    keyboard_activation_traversal_containment_dismissal_and_return_require_evidence: true
  semantics:
    names_roles_values_relationships_and_live_announcements_require_evidence: true
    disabled_state_required_where_applicable: true
    busy_state_prevents_repeated_activation: true
    selected_current_invalid_and_expanded_only_where_applicable: true
  text_scaling:
    verification_minimum_linear_equivalent: 1.0
    verification_maximum_linear_equivalent: 2.0
    range_inclusive: true
    platform_text_scaler_must_not_be_clamped: true
    nonlinear_platform_scaling_must_be_honored: true
    above_verified_range: "best-effort-without-blocking-or-overriding-platform"
    fixed_heights_are_minimums_not_clipping_maxima: true
    reflow_and_overflow_evidence_required: true
  reduced_motion:
    preference_must_be_respected: true
    nonessential_motion_must_have_reduced_alternative: true
    positional_scale_droplet_and_sliding_motion: "immediate"
    nonmoving_opacity_maximum_duration_ms: 150
    loading_requires_static_busy_alternative: true
  haptics:
    purpose_and_disablement_must_be_explicit: true
    platform_overrides_must_remain_within_platform_boundary: true
    touch_platform_only: true
    system_and_component_configuration_required: true
    forbidden_triggers:
      - "keyboard"
      - "focus"
      - "hover"
      - "programmatic-change"
      - "disabled-control"
      - "no-op-selection"
    maximum_pulses_per_committed_action: 1
    rapid_repeated_action_pulses_forbidden: true
  component_state_manifest_ref: "contracts/components/state-applicability.yaml"
  visual_baseline_manifest_ref: "contracts/visual-baselines.yaml"
  implementation_evidence: "implemented-local-parent-gates-required"
  conformance_claim_authorized: false

component_decisions:
  button:
    decision_ref: "BLDS-PHASE3-BUTTON-DESIGN-GATE-REPAIR-2026-07-25"
    contrast_amendment:
      decision_ref: "BLDS-BUTTON-CONTRAST-2026-07-28"
      decision_document: "docs/BLDS_PHASE_3_BUTTON_CONTRAST_DECISION.md"
      approved_by: "byungsker"
      approved_on: "2026-07-28"
      standard_mode_compatibility_lock_superseded_for:
        - "semantic.action.primary-foreground"
        - "semantic.action.destructive-foreground"
      replacement: "primitive.color.black"
      preserved:
        - "primary-and-destructive-surfaces"
        - "hover-and-pressed-overlays"
        - "focus-treatment"
        - "geometry"
        - "motion"
        - "high-contrast-mappings"
      custom_child_inheritance:
        - "DefaultTextStyle"
        - "IconTheme"
      explicit_custom_child_colors: "consumer-owned"
      disabled_contrast: "inactive-exempt-unverified"
      loading_busy: "not-claimed"
    scope: "button-family-only"
    hover:
      token_refs:
        - "component.button.primary.hover-overlay"
        - "component.button.secondary.hover-overlay"
        - "component.button.destructive.hover-overlay"
      applies_to: "enabled-hover-capable-pointer-only"
      clear_on: ["pointer-exit", "disable", "app-lifecycle-change"]
      pressed_replaces_hover: true
    focus:
      primary_outline: "semantic.focus.accent"
      destructive_outline: "semantic.focus.accent"
      secondary_outline:
        light: "primitive.color.black"
        dark: "primitive.color.white"
        high-contrast-light: "primitive.color.black"
        high-contrast-dark: "primitive.color.white"
      outer_ring: "semantic.focus.canvas"
      outline_width: "semantic.focus.outline-width"
      outer_ring_width: "semantic.focus.ring-width"
      surface_radius: "BLabRadius.md"
      outer_radius: "BLabRadius.md + semantic.focus.ring-width"
      one_color_fallback_forbidden: true
    compatibility_corrections:
      activation: "immediate-exactly-once-on-committed-activation"
      curve: "BLabMotion.ease"
      radius: "BLabRadius.md"
      classification: "compatibility-correction-not-legacy-retained"
  text-field:
    decision_ref: "BLDS-PHASE3-TEXTFIELD-DESIGN-DEPENDENCY-2026-07-26"
    scope: "text-field-family-only"
    token_mapping:
      surface: "component.glass.surface"
      default_border: "component.glass.border"
      hover_border: "component.text-field.hover-border"
      focus_outline: "component.text-field.focus-outline"
      focus_outer_ring: "component.text-field.focus-outer-ring"
      error_border: "component.text-field.error-border"
      label: "component.text-field.label"
      hint: "component.text-field.hint"
      error_copy: "semantic.text.primary"
      clear_background: "component.text-field.clear-background"
      clear_foreground: "component.text-field.clear-foreground"
    interaction:
      hover: "enabled-hover-capable-pointer-only"
      focus_outline: "any-enabled-focus"
      focus_outer_ring: "keyboard-visible-focus-only"
      precedence:
        - "disabled"
        - "enabled-focus"
        - "unfocused-invalid"
        - "unfocused-pointer-hover"
        - "default"
      disabled_suppresses:
        - "hover"
        - "focus"
        - "focus-outer-ring"
        - "editing"
        - "automatic-clear"
      disabled_invalid_retains:
        - "validation-copy"
        - "invalid-semantics"
      focused_invalid_border: "component.text-field.focus-outline"
      unfocused_invalid_border: "component.text-field.error-border"
      clear_action_minimum_target: "44x44"
      reduced_motion: "immediate-border-feedback"
    contrast:
      focus_outline_over_field_minimum: 3.0
      focus_outer_ring_over_canvas_minimum: 3.0
      hint_over_field_minimum: 4.5
      error_copy_over_canvas_minimum: 4.5
      clear_background_over_field_minimum: 3.0
      clear_foreground_over_background_minimum: 3.0
      standard_light_field_composite: "#E6E6E6"
      standard_dark_field_composite: "#2F2F2F"
      high_contrast_fields_opaque: true
    compatibility_corrections:
      classification: "compatibility-correction-not-legacy-retained"
      standard_hint_alpha: "60-percent"
      standard_clear_background_alpha: "60-percent"
      focused_outline: "monochrome"
      error_copy: "semantic-text-primary"
      clear_foreground: "semantic-text-inverse"
    semantics:
      label_hint_value_and_support_relationship: "single-field-semantic-container"
      invalid_when: "errorText-is-non-null"
      required_when: "isRequired-is-true"
      error_supersedes_helper: true
      clear_label: "platform-localized-material-clear-tooltip"
    unsupported_not_simulated:
      - "loading"
      - "current"
      - "selected"
      - "autofill"
      - "prefix"
  pressable-card:
    decision_ref: "BLDS-PHASE3-PRESSABLE-CARD-DESIGN-DECISION-2026-07-26"
    decision_document: "docs/BLDS_PHASE_3_PRESSABLE_CARD_DESIGN_DECISION.md"
    scope: "pressable-wrapper-and-card-family-only"
    public_api:
      pressable_inheritance: "StatefulWidget"
      card_inheritance: "StatelessWidget"
      legacy_constructor_source_compatible: true
      required_nullable_on_tap: true
      constructor_on_tap_input: "required-nullable-controls-effective-actionability"
      effective_on_tap: "private-nullable-constructor-input"
      exported_on_tap_field: "non-null-legacy-source-compatibility"
      null_input_exported_on_tap_behavior: "stable-no-op-must-not-signal-actionability"
      semantic_additions: ["semanticLabel", "semanticHint"]
