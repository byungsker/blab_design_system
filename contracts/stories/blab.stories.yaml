      - {id: "segmented-control.disabled", label: "Disabled item", states: ["disabled-item-or-control"], setup: "One fixed item has enabled false."}
      - {id: "segmented-control.scroll-overflow", label: "Owned narrow overflow", states: ["scrollable-overflow"], setup: "Five fixed items render in an 80 logical-pixel viewport."}

