schema: "blab.story-manifest/v1"

metadata:
  version: "0.1.0"
  status: "implemented-local-candidate-evidence"
  contract_ref: "contracts/components/state-applicability.yaml"
  registration_source: "example/lib/story_catalog.dart"
  determinism:
    network: "forbidden"
    clock: "fixed-or-not-used"
    randomness: "forbidden"
    customer_data: "forbidden"
  candidate_capture_scope:
    shared_harness: "test/support/phase4_candidate_harness.dart"
    required_component_ids: ["button", "text-field", "segmented-control", "tab-bar", "bottom-bar", "pressable-wrapper", "card", "snackbar", "keyboard-accessory-bar"]
    fixture_modes: ["en-US", "ko-KR", "synthetic-40-percent-expansion", "ar-RTL-bidi", "text-scale-2", "reduced-motion", "360-narrow"]
    evidence: "Candidate captures assert all nine public families are fully framed and use public API for a persistent Snackbar under the same MaterialApp.builder overlay-root scenario context."
    claim: "deterministic-reproducibility-only"
    excluded_claims: ["Design-approved visual conformance", "accessibility conformance", "runtime font policy", "locale translation approval"]

unsupported_fixture_categories:
  - id: "loading"
    reason: "No current public component has implemented loading evidence; Button loading-busy remains conditional and unclaimed."
  - id: "no-results"
    reason: "No current public component contract defines a no-results state; this remains a product pattern rather than a fabricated widget state."

stories:
  - component_id: "button"
    public_type: "BLabButton"
    story_id: "button"
    source: "example/lib/stories/button_story.dart"
    fixtures:
      - {id: "button.default", label: "Default and destructive variants", states: ["default", "destructive-variant"], setup: "Enabled callbacks; fixed labels; no external effects."}
      - {id: "button.hover", label: "Pointer hover", states: ["hover-pointer"], setup: "Mouse pointer enters the enabled primary button."}
      - {id: "button.pressed", label: "Pressed", states: ["pressed"], setup: "Pointer-down is held without activation."}
      - {id: "button.focus", label: "Keyboard-visible focus", states: ["focus"], setup: "Tab traversal focuses the enabled primary button."}
      - {id: "button.disabled", label: "Disabled", states: ["disabled"], setup: "onPressed is null."}

  - component_id: "text-field"
    public_type: "BLabTextField"
    story_id: "text-field"
    source: "example/lib/stories/text_field_story.dart"
    fixtures:
      - {id: "text-field.empty", label: "Empty", states: ["empty"], setup: "Controller text is the empty string."}
      - {id: "text-field.populated", label: "Populated", states: ["populated"], setup: "Controller has fixed sample text."}
      - {id: "text-field.hover", label: "Pointer hover", states: ["hover-pointer"], setup: "Mouse pointer enters an enabled unfocused field."}
      - {id: "text-field.focus", label: "Keyboard-visible focus", states: ["focus"], setup: "Tab traversal focuses an enabled field."}
      - {id: "text-field.read-only", label: "Read only", states: ["read-only"], setup: "readOnly is true with fixed text."}
      - {id: "text-field.obscured", label: "Obscured", states: ["obscured"], setup: "obscureText is true with fixed text."}
      - {id: "text-field.multiline", label: "Multiline", states: ["multiline"], setup: "maxLines is four."}
      - {id: "text-field.disabled", label: "Disabled", states: ["disabled"], setup: "enabled is false."}
      - {id: "text-field.required", label: "Required", states: ["required"], setup: "isRequired is true."}
      - {id: "text-field.invalid", label: "Invalid with error help", states: ["invalid", "error-help"], setup: "Fixed invalid value and localized errorText are supplied."}
      - {id: "text-field.clear", label: "Clear action", states: ["clear-action"], setup: "Enabled populated field receives pointer or keyboard activation on its clear action."}

  - component_id: "segmented-control"
